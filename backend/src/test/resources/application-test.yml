# Profile used by @SpringBootTest integration tests: in-memory H2 (PostgreSQL mode),
# no data seeding, no submission rate limit. Everything else inherits application.yml.
spring:
  datasource:
    url: jdbc:h2:mem:cptest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  seed:
    enabled: false

submission:
  rate-limit-seconds: 0
